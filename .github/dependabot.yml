version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- NPM ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      node-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    ignore:
      # @types/node majors track the Node major (.nvmrc); bump it only when
      # the supported runtime floor moves.
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      # Vibator's type-aware rules need the JS compiler API, which the
      # TypeScript 7 native compiler drops. Stay on 6.x until vibator moves.
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
