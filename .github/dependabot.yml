version: 2
updates:
  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- NPM ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    groups:
      tools:
        dependency-type: "production"
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      dev-dependencies:
        dependency-type: "development"
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    ignore:
      # @types/node majors track the Node major (.nvmrc); bump it only when
      # the supported runtime floor moves.
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
      # vibator caps its typescript peer range below 7; move the major here
      # in step with the framework.
      - dependency-name: "typescript"
        update-types: [ "version-update:semver-major" ]
