name: 💡 Preset change
description: Propose a change to one of the strict presets
title: "💡 <TITLE>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a preset change. The presets are the product:
        a change ships to every downstream repository on its next dependabot
        bump, so it must be justified on its own. A change qualifies when it
        raises the bar for every consumer, stays generic (no product names,
        no repo layout assumptions), and does not need a per-project opt-out
        to be livable.
  - type: input
    id: preset
    attributes:
      label: Preset
      description: The preset file this touches, like `biome.json` or `dependency-cruiser.cjs`.
    validations:
      required: true
  - type: textarea
    id: what-changes
    attributes:
      label: What should change and why
      description: >
        Describe the rule or option to add, tighten or drop, and the defect
        or friction it addresses. Explain why consumers cannot solve it in
        their own thin config instead.
    validations:
      required: true
  - type: textarea
    id: downstream-impact
    attributes:
      label: Downstream impact
      description: >
        Describe what breaks or newly fails in a typical consuming repository
        after this change, and what the one-line fix looks like for them.
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/vibator/gate/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow Vibator's Code of Conduct
          required: true
