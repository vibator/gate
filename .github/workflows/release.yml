name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Mint the release bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: npm ci

      - name: Verify the gates one last time
        run: npm run verify

      - name: Semantic Release per package (version commit + tag + Release + npm via OIDC)
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: npm run release:ci --workspaces
